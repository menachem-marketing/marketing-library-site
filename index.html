<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ספריית הידע לשיווק</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<div id="root"></div>
<script>
window.instinctFile = (function () {
  function fromHash() {
    var h = location.hash;
    return h.charAt(0) === "#" && h.charAt(1) === "/" ? h.slice(1) : "/";
  }
  window.addEventListener("hashchange", function () {
    window.dispatchEvent(new CustomEvent("instinct-route", { detail: fromHash() }));
  });
  return {
    initialRoute: fromHash(),
    route: function (p) {
      try {
        var target = "#" + p;
        if (location.hash !== target) history.replaceState(null, "", target);
      } catch (e) {}
    }
  };
})();
</script>
<script src="main.js"></script>
</body>
</html>
